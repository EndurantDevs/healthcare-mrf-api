[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-release-preparation"
version = "0.1.0"
description = "Native plan-release preparation contracts"
requires-python = ">=3.14"
dependencies = ["SQLAlchemy>=2.0.54", "python-dateutil>=2.9.0.post0"]
license-files = ["LICENSE"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["db", "process", "process.ptg_parts"]
namespaces = true

[tool.setuptools.package-data]
process = ["plan_release_preparation_library.json"]
