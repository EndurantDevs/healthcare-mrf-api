name: Public artifact cleanup
'on':
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('public-artifact-cleanup-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || 'public-artifact-cleanup' }}
  cancel-in-progress: false
jobs:
  stale-cleanup:
    if: github.repository == 'EndurantDevs/healthcare-mrf-api' && github.ref == 'refs/heads/main' && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted artifact lifecycle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EndurantDevs/endurant-ci
          ref: 8f8e0d26b4fb58fd99f322ad98b581a1b867ca41
          path: ci
          persist-credentials: false
      - name: Delete only obsolete authenticated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 ci/scripts/artifact_cleanup.py --stale
  completed-cleanup:
    name: CI artifact cleanup
    if: >-
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'CI' && github.event.workflow_run.display_title == 'CI' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out trusted cleanup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EndurantDevs/endurant-ci
          ref: 17dc341ea4027abc728655aa873bccc6939d306a
          path: ci
          persist-credentials: false
      - name: Install pinned uv
        run: bash ci/scripts/install_uv
      - name: Install uv-managed Python
        run: bash ci/scripts/setup_python
      - name: Remove validated CI intermediates
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 ci/scripts/artifact_cleanup.py --completed
