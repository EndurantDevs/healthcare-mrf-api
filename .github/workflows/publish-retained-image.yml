# Generated from the pinned retained image publisher.
name: Retained DEV image publication
run-name: Retained DEV image ${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
      source_run_attempt:
        required: true
        type: string
      image_artifact_id:
        required: true
        type: string
      measurement_artifact_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: retained-dev-image-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
  cancel-in-progress: false
jobs:
  dev-image-publication:
    name: DEV image publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
    env:
      CI_REVISION: cd8e00cc0134afc2413227c95676deea89428cf3
      PYTHONDONTWRITEBYTECODE: '1'
      IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
      MEASUREMENT_ARTIFACT_ID: ${{ inputs.measurement_artifact_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
    steps:
    - name: Check out trusted image publisher
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: cd8e00cc0134afc2413227c95676deea89428cf3
        path: ci
        persist-credentials: false
    - name: Install pinned uv
      run: bash ci/scripts/install_uv
    - name: Install uv-managed Python
      run: bash ci/scripts/setup_python
    - name: Install locked publisher dependencies
      run: 'uv --no-config pip install --require-hashes --only-binary=:all: -r ci/scripts/requirements-python-quality.lock'
    - name: Authenticate retained DEV image input
      id: image
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image_recovery.py prepare
    - name: Download validated image archive
      if: steps.image.outputs.publish == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ steps.image.outputs.artifact_id }}
        digest-mismatch: error
        path: ${{ runner.temp }}/public-image-download
        merge-multiple: true
        run-id: ${{ inputs.source_run_id }}
        github-token: ${{ github.token }}
    - name: Stage DEV image publication intent
      if: steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image_recovery.py stage
    - name: Upload DEV image publication intent
      if: steps.image.outputs.publish == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: healthcare-public-image-recovery-intent-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/public-image-intent/intent.json
        if-no-files-found: error
        retention-days: 1
    - name: Publish validated DEV image
      if: steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image_recovery.py publish
    - name: Upload DEV image receipt
      if: steps.image.outputs.publish == 'true'
      id: receipt-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: healthcare-public-image-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/public-image-receipt/image.json
        if-no-files-found: error
        retention-days: 90
    - name: Reconcile DEV image publication
      if: always() && steps.image.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_image_recovery.py reconcile
    outputs:
      receipt_artifact_id: ${{ steps.receipt-artifact.outputs.artifact-id }}
    if: github.repository == 'EndurantDevs/healthcare-mrf-api' && github.ref == 'refs/heads/dev'
