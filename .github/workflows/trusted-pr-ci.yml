name: Trusted pull request CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # Read workflow runs, the exact-base artifact, and the pinned CI image.
  actions: read
  contents: read
  packages: read

jobs:
  ci:
    uses: EndurantDevs/healthcare-mrf-api/.github/workflows/ci.yml@main
    with:
      activate_arc: true
