    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  worker-queue-smoke:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Worker queue tests (metadata only)' || 'Worker queue tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - python-quality
    - readability-preflight
    services:
      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
