    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - python-quality
    - readability-preflight
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: a38a56566385b90f31ad1ba3b4c7c28d3de9612e
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Run complete validation stage
      run: 'bash "$CI_ROOT/scripts/healthcare/check" api-contract

        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  rust-scanner:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Rust tests (metadata only)' || 'Rust tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
    - python-quality
    - readability-preflight
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
