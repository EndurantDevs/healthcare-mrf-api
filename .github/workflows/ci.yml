name: CI

on:
  workflow_call:
    inputs:
      activate_arc:
        description: Request ARC only after protected-main and fork checks pass
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact 40-character target base SHA for coverage forecasting
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.14.6"
  CARGO_TERM_COLOR: always
  COVERAGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
  CAPACITY_TEST_PATHS: |-
    tests/test_ptg2_capacity_evidence.py
    tests/test_ptg2_v3_bounded_readers.py
    tests/test_ptg2_v3_capacity_gate.py
    tests/test_ptg2_v3_capacity_gate_adversarial.py
    tests/test_ptg2_v3_capacity_resources.py

jobs:
  public-hygiene:
    name: public hygiene
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run shared pre-push gate
        run: scripts/ci/prepush hygiene
  python-quality:
    name: python quality
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run shared pre-push gate
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
        run: scripts/ci/prepush quality
  python-tests:
    name: python test suite (${{ matrix.shard-index }}/4)
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard-index: [0, 1, 2, 3]
    env:
      COVERAGE_FILE: .coverage.main.${{ matrix.shard-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Run shared pre-push gate
        run: scripts/ci/prepush python-main "${{ matrix.shard-index }}"
      - name: Upload main-suite coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-python-coverage-main-${{ matrix.shard-index }}
          path: |
            .coverage.main.${{ matrix.shard-index }}
            .coverage-provenance.main.${{ matrix.shard-index }}.json
          include-hidden-files: true
          retention-days: 1

  capacity-evidence:
    name: ptg2 capacity evidence
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    env:
      COVERAGE_FILE: .coverage.capacity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Run shared pre-push gate
        run: scripts/ci/prepush capacity
      - name: Upload capacity coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-python-coverage-capacity
          path: |
            .coverage.capacity
            .coverage-provenance.capacity.json
          include-hidden-files: true
          retention-days: 1

  test-coverage:
    name: test coverage ratchet
    permissions:
      actions: read
      contents: read
      packages: read
    needs:
      - public-hygiene
      - python-quality
      - python-tests
      - capacity-evidence
      - api-contract
      - rust-scanner
      - container-package
      - security
      - worker-queue-smoke
      - address-canonical-db-tests
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Resolve exact base coverage run
        id: base-coverage
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          machine_artifact_required=$(git show "$BASE_SHA:test-coverage-baseline.json" | jq -r '.machine_artifact_required // false')
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$machine_artifact_required" != true ]; then
            echo "reference_baseline=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deadline=$((SECONDS + 180))
          while :; do
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              echo "timed out waiting for exact-base CI run" >&2
              exit 1
            fi
            response=$(curl --fail-with-body --silent --show-error --get \
              --connect-timeout 10 --max-time "$((remaining < 20 ? remaining : 20))" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode branch=main \
              --data-urlencode event=push \
              --data-urlencode "head_sha=$BASE_SHA" \
              --data-urlencode per_page=100 \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs")
            run_id=$(jq -er --arg base_sha "$BASE_SHA" '
              [.workflow_runs[] | select(.head_sha == $base_sha and .event == "push" and .head_branch == "main")]
              | sort_by([.run_started_at, .id])
              | if any(.status == "completed" and .conclusion == "success") then
                map(select(.status == "completed" and .conclusion == "success")) | last.id
                elif any(.status != "completed" and .conclusion == null) then "pending"
                elif length == 0 then "pending"
                else error("no successful exact-base CI run") end
            ' <<<"$response")
            if [ "$run_id" != pending ]; then break; fi
            echo "Waiting for live exact-base CI run to complete."
            remaining=$((deadline - SECONDS))
            if (( remaining > 0 )); then sleep "$((remaining < 10 ? remaining : 10))"; fi
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "reference_baseline=coverage-data/baseline/test-coverage-baseline.json" >> "$GITHUB_OUTPUT"
      - name: Download exact base coverage baseline
        if: steps.base-coverage.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: healthcare-mrf-api-coverage-baseline-${{ steps.base-coverage.outputs.base_sha }}
          path: coverage-data/baseline
          github-token: ${{ github.token }}
          run-id: ${{ steps.base-coverage.outputs.run_id }}
      - name: Download main-suite coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mrf-python-coverage-main-*
          path: coverage-data/main
          merge-multiple: true
      - name: Download capacity coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mrf-python-coverage-capacity
          path: coverage-data/capacity
      - name: Download PostgreSQL coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mrf-python-coverage-postgres-*
          path: coverage-data/postgres
          merge-multiple: true
      - name: Download Rust coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mrf-rust-coverage
          path: coverage-data/rust
      - name: Run combined coverage gate
        env:
          PREPUSH_RUST_ARTIFACTS: coverage-data/rust
          PREPUSH_COVERAGE_OUTPUT: coverage-output/test-coverage-forecast.json
          PREPUSH_BASELINE_OUTPUT: coverage-output/test-coverage-baseline.json
          PREPUSH_BASELINE_DOCS_OUTPUT: coverage-output/test-coverage.md
          PREPUSH_REFERENCE_BASELINE: ${{ steps.base-coverage.outputs.reference_baseline }}
        run: scripts/ci/prepush python-coverage
      - name: Upload machine coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: healthcare-mrf-api-coverage-baseline-${{ github.sha }}
          path: |
            coverage-output/test-coverage-baseline.json
            coverage-output/test-coverage.md
          if-no-files-found: error
          retention-days: 90
      - name: Upload coverage forecast
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-coverage-forecast
          path: coverage-output/
          if-no-files-found: warn
          retention-days: 1

  api-contract:
    name: openapi contract
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run shared pre-push gate
        run: scripts/ci/prepush api-contract
  rust-scanner:
    name: rust scanner
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Run shared pre-push gate
        run: scripts/ci/prepush rust
      - name: Upload Rust coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-rust-coverage
          path: coverage-artifacts/rust
          if-no-files-found: ignore
          retention-days: 1
  container-package:
    name: linux container package
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_DIND_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run shared pre-push gate
        run: scripts/ci/prepush container-package
  security:
    name: dependency and semgrep security
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_DIND_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Run shared pre-push gate
        run: scripts/ci/prepush security
  worker-queue-smoke:
    name: redis worker queue smoke
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    services:
      redis:
        image: redis:7@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run shared pre-push gate
        env:
          HLTHPRT_REDIS_ADDRESS: ${{ runner.environment == 'self-hosted' && 'redis://127.0.0.1:6379' || 'redis://redis:6379' }}
        run: scripts/ci/prepush redis
  address-canonical-db-tests:
    name: postgres18 postgis tests (${{ matrix.shard }})
    runs-on: >-
      ${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') || (inputs.activate_arc &&
      github.event_name == 'pull_request' &&
      github.ref == format('refs/pull/{0}/merge', github.event.number) &&
      github.repository == 'EndurantDevs/healthcare-mrf-api' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]'))) &&
      vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:0e97164f0e06b60fe5608e5654e026a88c3ef5d3b6a195a26fdc60489b404803
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard:
          - core
          - provider-directory
          - provider-profile
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:0aacdfb9dda40942d424785c3ccabeffe31da9cc9e26b0dfd93b222b31462871
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ptg2_v3_lifecycle_test_ci_runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ptg2_v3_lifecycle_test_ci_runner"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    env:
      COVERAGE_FILE: .coverage.postgres.${{ matrix.shard }}
      PYTEST_ADDOPTS: >-
        --cov-config=test-coverage.ini
        --cov=api --cov=db --cov=process --cov=public_evidence --cov=service --cov=main
        --cov-branch --cov-report= --cov-append
      HLTHPRT_DB_DRIVER: asyncpg
      HLTHPRT_DB_PORT: "5432"
      HLTHPRT_DB_USER: postgres
      HLTHPRT_DB_PASSWORD: postgres
      HLTHPRT_DB_DATABASE: ptg2_v3_lifecycle_test_ci_runner
      HLTHPRT_DB_SCHEMA: mrf
      DB_SCHEMA: mrf
      HLTHPRT_REDIS_ADDRESS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Run shared pre-push gate
        env:
          HLTHPRT_DB_HOST: ${{ runner.environment == 'self-hosted' && '127.0.0.1' || 'postgres' }}
        run: scripts/ci/prepush postgres "${{ matrix.shard }}"
      - name: Upload PostgreSQL coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-python-coverage-postgres-${{ matrix.shard }}
          path: |
            .coverage.postgres.${{ matrix.shard }}
            .coverage-provenance.postgres.${{ matrix.shard }}.json
          include-hidden-files: true
          retention-days: 1
