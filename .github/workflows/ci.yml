name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    name: portable import checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Check public repository hygiene
        run: python scripts/ci/public_hygiene.py
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -c requirements-dev.txt pytest pytest-asyncio
      - name: Run synthetic import and API checks
        run: >-
          python -m pytest -q
          tests/test_process_nucc_unit.py tests/test_process_code_sets_unit.py tests/test_healthcheck.py tests/test_public_runtime_packaging.py tests/test_public_ci.py
      - name: Check finalizer unlink failure as a non-root user
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          test "$(id -u)" -ne 0
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          cargo +1.97.1 test --locked --manifest-path support/ptg2_scanner/Cargo.toml --bin ptg2_scanner \
            main_test_suite::cases::scanner_and_v3_finalizer::owned_unlink_failure_prevents_finalizer_publication \
            -- --exact --nocapture
  source-validation:
    name: Source validation
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: EndurantDevs/endurant-ci/.github/workflows/healthcare.yml@df40c093b47ab0c7eaa6d83e3b95142bc22500cc
    with:
      ci_revision: 'df40c093b47ab0c7eaa6d83e3b95142bc22500cc'
