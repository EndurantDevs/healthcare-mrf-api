name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact 40-character target base SHA for coverage forecasting
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.14"
  CARGO_TERM_COLOR: always
  COVERAGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
  CAPACITY_TEST_PATHS: |-
    tests/test_ptg2_capacity_evidence.py
    tests/test_ptg2_v3_bounded_readers.py
    tests/test_ptg2_v3_capacity_gate.py
    tests/test_ptg2_v3_capacity_gate_adversarial.py
    tests/test_ptg2_v3_capacity_resources.py

jobs:
  public-hygiene:
    name: public hygiene
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:12320cf489cc218f00d04e9df21d12f60bacd883e5120bd8dabb7ba0378c972c
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit message policy
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check_commit_messages.py --event "$GITHUB_EVENT_PATH"
          else
            if [[ ! "$COVERAGE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "COVERAGE_BASE_SHA must be an exact commit SHA" >&2
              exit 2
            fi
            python3 scripts/check_commit_messages.py --range "$COVERAGE_BASE_SHA..HEAD"
          fi
      - name: Test public repository hygiene gate
        run: python3 tests/test_public_hygiene.py
      - name: Check public repository hygiene
        run: python3 scripts/ci/public_hygiene.py

  python-quality:
    name: python quality
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:12320cf489cc218f00d04e9df21d12f60bacd883e5120bd8dabb7ba0378c972c
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit message policy
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check_commit_messages.py --event "$GITHUB_EVENT_PATH"
          else
            if [[ ! "$COVERAGE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "COVERAGE_BASE_SHA must be an exact commit SHA" >&2
              exit 2
            fi
            python3 scripts/check_commit_messages.py --range "$COVERAGE_BASE_SHA..HEAD"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile service modules
        run: python -m compileall api process db public_evidence scripts main.py
      - name: Provider Directory runtime contract
        run: python scripts/smoke/provider_directory_runtime_contract.py
      - name: Check Provider Directory support documentation
        run: python scripts/generate_provider_directory_support_docs.py --check
      - name: Check readability CI policy
        run: bash tests/test_ci_readability_policy.sh
      - name: Readability budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          READABILITY_ZERO_GROWTH_APPROVED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'readability-zero-growth-approved') }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git show "$BASE_SHA:readability-baseline.json" > "$RUNNER_TEMP/readability-base.json"
            required_reduction_percent=1
            if git diff --quiet "$BASE_SHA" HEAD -- \
              main.py \
              ':(glob)api/**/*.py' \
              ':(glob)db/**/*.py' \
              ':(glob)process/**/*.py' \
              ':(glob)public_evidence/**/*.py' \
              ':(glob)service/**/*.py'; then
              required_reduction_percent=0
            elif [ "$READABILITY_ZERO_GROWTH_APPROVED" = "true" ]; then
              required_reduction_percent=0
            fi
            python scripts/readability_budget.py \
              --ratchet-baseline "$RUNNER_TEMP/readability-base.json" \
              --required-reduction-percent "$required_reduction_percent"
          else
            python scripts/readability_budget.py
          fi
      - name: Guard request-time external calls
        run: python scripts/ci/request_time_external_call_guard.py
      - name: Coverage forecast contracts
        run: timeout --foreground 295s python -m pytest -q tests/test_coverage_forecast.py tests/test_ci_coverage_forecast.py

  python-tests:
    name: python test suite (${{ matrix.shard-index }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
    env:
      COVERAGE_FILE: .coverage.main.${{ matrix.shard-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies and build Rust test binaries
        run: |
          (
            python -m pip install --upgrade pip
            python -m pip install -r requirements-dev.txt
          ) &
          pip_pid=$!
          cargo build --locked --bins --manifest-path support/ptg2_scanner/Cargo.toml &
          cargo_pid=$!
          wait "$pip_pid"
          wait "$cargo_pid"
      - name: Run non-capacity tests with coverage
        run: |
          mapfile -t capacity_tests <<< "$CAPACITY_TEST_PATHS"
          collection_args=()
          for test_path in "${capacity_tests[@]}"; do
            collection_args+=(--ignore "$test_path")
          done
          shard_file="$RUNNER_TEMP/python-test-shard-${{ matrix.shard-index }}.txt"
          python scripts/ci/shard_pytest_nodeids.py \
            --shard-count 4 \
            --shard-index "${{ matrix.shard-index }}" \
            --output "$shard_file" \
            -- "${collection_args[@]}"
          timeout --foreground 295s python -m pytest -q -n 1 --dist loadscope --durations=20 \
            --cov-config=test-coverage.ini \
            --cov=api --cov=db --cov=process --cov=public_evidence --cov=service --cov=main \
            --cov-branch --cov-report= \
            @"$shard_file"
      - name: Bind main-suite coverage to source and base
        run: >
          timeout --foreground 295s python scripts/coverage_forecast.py write-shard-provenance
          --base "$COVERAGE_BASE_SHA"
          --kind main
          --shard "${{ matrix.shard-index }}"
          --coverage ".coverage.main.${{ matrix.shard-index }}"
          --output ".coverage-provenance.main.${{ matrix.shard-index }}.json"
      - name: Upload main-suite coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-python-coverage-main-${{ matrix.shard-index }}
          path: |
            .coverage.main.${{ matrix.shard-index }}
            .coverage-provenance.main.${{ matrix.shard-index }}.json
          include-hidden-files: true
          retention-days: 1

  capacity-evidence:
    name: ptg2 capacity evidence
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:12320cf489cc218f00d04e9df21d12f60bacd883e5120bd8dabb7ba0378c972c
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    env:
      COVERAGE_FILE: .coverage.capacity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run capacity evidence tests with coverage
        run: |
          mapfile -t capacity_tests <<< "$CAPACITY_TEST_PATHS"
          timeout --foreground 295s python -m pytest -q -n 4 --dist load --durations=20 \
            --cov-config=test-coverage.ini \
            --cov=api --cov=db --cov=process --cov=public_evidence --cov=service --cov=main \
            --cov-branch --cov-report= \
            "${capacity_tests[@]}"
      - name: Bind capacity coverage to source and base
        run: >
          timeout --foreground 295s python scripts/coverage_forecast.py write-shard-provenance
          --base "$COVERAGE_BASE_SHA"
          --kind capacity
          --shard capacity
          --coverage .coverage.capacity
          --output .coverage-provenance.capacity.json
      - name: Upload capacity coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-python-coverage-capacity
          path: |
            .coverage.capacity
            .coverage-provenance.capacity.json
          include-hidden-files: true
          retention-days: 1

  test-coverage:
    name: test coverage ratchet
    needs:
      - python-tests
      - capacity-evidence
      - address-canonical-db-tests
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:12320cf489cc218f00d04e9df21d12f60bacd883e5120bd8dabb7ba0378c972c
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install coverage tooling
        run: python -m pip install coverage==7.15.2
      - name: Download main-suite coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mrf-python-coverage-main-*
          path: coverage-data/main
          merge-multiple: true
      - name: Download capacity coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mrf-python-coverage-capacity
          path: coverage-data/capacity
      - name: Download PostgreSQL coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mrf-python-coverage-postgres-*
          path: coverage-data/postgres
          merge-multiple: true
      - name: Forecast Python coverage ratchet
        run: |
          timeout --foreground 295s python scripts/coverage_ratchet.py --self-test
          timeout --foreground 295s python scripts/coverage_forecast.py forecast-python \
            --base "$COVERAGE_BASE_SHA" \
            --main-artifacts coverage-data/main \
            --capacity-artifacts coverage-data/capacity \
            --postgres-artifacts coverage-data/postgres \
            --output test-coverage-forecast-python.json
      - name: Upload Python coverage forecast
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-python-coverage-forecast
          path: test-coverage-forecast-python.json
          if-no-files-found: ignore
          retention-days: 1

  api-contract:
    name: openapi contract
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.HEALTHCARE_MRF_CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/endurantdevs/healthcare-mrf-api-arc-ci@sha256:12320cf489cc218f00d04e9df21d12f60bacd883e5120bd8dabb7ba0378c972c
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run OpenAPI route/spec checks
        run: timeout --foreground 295s python -m pytest -q tests/test_openapi_spec.py tests/test_formulary_fhir_openapi.py tests/test_api_init_and_utils.py tests/test_healthcheck.py

  rust-scanner:
    name: rust scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: support/ptg2_scanner
      - name: Install Python build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Format check
        run: cargo fmt --manifest-path support/ptg2_scanner/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path support/ptg2_scanner/Cargo.toml --all-targets -- -D warnings
      - name: Scanner tests
        run: |
          mkdir -p coverage-artifacts/rust
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          timeout --foreground 295s cargo llvm-cov --manifest-path support/ptg2_scanner/Cargo.toml \
            --all-targets --features python --json --summary-only \
            --output-path coverage-artifacts/rust/test-coverage-rust.json
      - name: Bind Rust coverage to source and base
        run: >
          timeout --foreground 295s python scripts/coverage_forecast.py write-report-provenance
          --base "$COVERAGE_BASE_SHA"
          --report-name rust
          --report coverage-artifacts/rust/test-coverage-rust.json
          --output coverage-artifacts/rust/coverage-provenance-rust.json
          --cargo-llvm-cov-version "$(cargo llvm-cov --version | awk '{print $2}')"
          --rust-version "$(rustc --version | awk '{print $2}')"
      - name: Upload Rust coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-rust-coverage
          path: coverage-artifacts/rust
          if-no-files-found: ignore
          retention-days: 1
      - name: Forecast Rust coverage ratchet
        run: |
          timeout --foreground 295s python scripts/coverage_ratchet.py --self-test
          timeout --foreground 295s python scripts/coverage_forecast.py forecast-rust \
            --base "$COVERAGE_BASE_SHA" \
            --artifacts coverage-artifacts/rust \
            --output test-coverage-forecast-rust.json
      - name: Upload Rust coverage forecast
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mrf-rust-coverage-forecast
          path: test-coverage-forecast-rust.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cd support/ptg2_scanner
          cargo audit
      - name: Build release scanner
        run: cargo build --release --bins --manifest-path support/ptg2_scanner/Cargo.toml
      - name: Cross-language Provider Directory COPY contract
        env:
          HLTHPRT_PROVIDER_DIRECTORY_PROJECTION_NATIVE_TEST_BIN: ${{ github.workspace }}/support/ptg2_scanner/target/release/ptg2_scanner
          HLTHPRT_PROVIDER_DIRECTORY_PROJECTION_NATIVE_BIN: ${{ github.workspace }}/support/ptg2_scanner/target/release/ptg2_scanner
        run: |
          timeout --foreground 295s python -m pytest -q \
            tests/test_provider_directory_projection_native_copy.py \
            tests/test_provider_directory_projection_native_cli_parity.py \
            tests/test_provider_directory_projection_native_copy_adversarial.py
      - name: Build and test PyO3 address canon wheel
        run: |
          cd support/ptg2_scanner
          python -m maturin build --release --features python-extension --out target/wheels
          python -m pip install target/wheels/*.whl
          cd ../..
          timeout --foreground 295s python -m pytest -q tests/test_address_canon_pyo3.py
      - name: Smoke address canonical COPY CLI
        run: |
          tmp=$(mktemp -d)
          support/ptg2_scanner/target/release/ptg2_scanner --canon-version | python -c 'import json,sys; payload=json.load(sys.stdin); assert payload["ruleset_version"] == 4, payload'
          printf "1\t(0,1)\t\\N\t123 Main St\tSuite 2\tAustin\tTX\t78701\tUS\n" > "$tmp/raw.copy"
          support/ptg2_scanner/target/release/ptg2_scanner \
            --address-canonicalize-copy "$tmp/raw.copy" "$tmp/keyed.copy"
          test -s "$tmp/keyed.copy"

  container-package:
    name: linux container package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image with both PTG binaries
        run: >
          docker build
          --platform linux/amd64
          --build-arg "HLTHPRT_SOURCE_COMMIT=${GITHUB_SHA}"
          --tag healthcare-mrf-api:ptg-v4-gate
          .
      - name: Prove source identity is image-baked
        run: |
          if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            healthcare-mrf-api:ptg-v4-gate \
            | grep -q '^HLTHPRT_SOURCE_COMMIT='; then
            exit 1
          fi
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/sh \
            healthcare-mrf-api:ptg-v4-gate \
            -ec '
              test "$(cat /opt/healthporta/build-identity/healthcare-source-commit)" = "$1"
              test "$(stat -c "%u:%g:%a:%h:%s" /opt/healthporta/build-identity/healthcare-source-commit)" = "0:0:444:1:41"
            ' sh "${GITHUB_SHA}"
      - name: Smoke packaged scanner, graph compiler, and native decoder
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/sh \
            healthcare-mrf-api:ptg-v4-gate \
            -ec '
              test -x /opt/support/ptg2_scanner/target/release/ptg2_scanner
              test -x /opt/support/ptg2_scanner/target/release/ptg2_provider_graph_v4
              /opt/venv/bin/python -c "import ptg2_address_canon as m; assert hasattr(m, '\''intersect_sorted_u32'\''); assert hasattr(m, '\''ptg2_decode_u32_le'\'')"
              /opt/venv/bin/python -B -c "import public_evidence; import process.npi"
            '
      - name: Prove reviewed formulary operator is packaged and dormant
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/sh \
            healthcare-mrf-api:ptg-v4-gate \
            -ec '
              set +e
              operation_output=$(env \
                -u HLTHPRT_FHIR_FORMULARY_REVIEWED_ACQUISITION_ENABLED \
                -u HLTHPRT_FHIR_FORMULARY_REVIEWED_PUBLICATION_ENABLED \
                /opt/venv/bin/python -B \
                /opt/scripts/smoke/formulary_fhir_reviewed_operator.py \
                acquire-twins --cutoff 2026-01-01T00:00:00Z 2>&1)
              operation_status=$?
              set -e
              test "$operation_status" -eq 1
              operation_last_line=$(printf "%s\n" "$operation_output" | tail -n 1)
              test "$operation_last_line" = '\''{"code":"disabled","status":"error"}'\''
            '
      - name: Prove exact formulary source operator is packaged and dormant
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/sh \
            healthcare-mrf-api:ptg-v4-gate \
            -ec '
              set +e
              operation_output=$(env \
                -u HLTHPRT_UHC_FORMULARY_ACQUISITION_ENABLED \
                -u HLTHPRT_UHC_FORMULARY_PUBLICATION_ENABLED \
                /opt/venv/bin/python -B \
                /opt/scripts/smoke/uhc_formulary_operator.py \
                acquire-admit \
                --raw-set-sha256 \
                aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
                2>&1)
              operation_status=$?
              set -e
              test "$operation_status" -eq 1
              operation_last_line=$(printf "%s\n" "$operation_output" | tail -n 1)
              test "$operation_last_line" = '\''{"code":"disabled","status":"error"}'\''
            '
      - name: Prove rooted Provider graph operator is packaged and dormant
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/sh \
            healthcare-mrf-api:ptg-v4-gate \
            -ec '
              set +e
              operation_output=$(env \
                -u HLTHPRT_PROVIDER_DIRECTORY_ROOTED_GRAPH_REGISTRATION_ENABLED \
                -u HLTHPRT_PROVIDER_DIRECTORY_ROOTED_GRAPH_ACQUISITION_ENABLED \
                -u HLTHPRT_PROVIDER_DIRECTORY_ROOTED_GRAPH_PUBLICATION_ENABLED \
                /opt/venv/bin/python -B \
                /opt/scripts/smoke/provider_directory_rooted_graph_operator.py \
                register 2>&1)
              operation_status=$?
              set -e
              test "$operation_status" -eq 1
              operation_last_line=$(printf "%s\n" "$operation_output" | tail -n 1)
              test "$operation_last_line" = '\''{"code":"disabled","status":"error"}'\''
            '
      - name: Prove reviewed Provider subset operators are packaged and dormant
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/sh \
            healthcare-mrf-api:ptg-v4-gate \
            -ec '
              for operation in \
                sync-verified-state \
                abandon-expired-root \
                seal-terminal-root \
                seal-direct-v4-terminal-root \
                seal-direct-v5-http410-root; do
                set +e
                operation_output=$(env \
                  -u HLTHPRT_PROVIDER_DIRECTORY_SUBSET_STATE_SYNC_ENABLED \
                  -u HLTHPRT_PROVIDER_DIRECTORY_REVIEWED_SUBSET_ABANDONMENT_ENABLED \
                  -u HLTHPRT_PROVIDER_DIRECTORY_REVIEWED_SUBSET_TERMINAL_DISPOSITION_ENABLED \
                  -u HLTHPRT_PROVIDER_DIRECTORY_REVIEWED_SUBSET_DIRECT_V4_TERMINAL_DISPOSITION_ENABLED \
                  -u HLTHPRT_PROVIDER_DIRECTORY_REVIEWED_SUBSET_DIRECT_V5_HTTP410_TERMINAL_DISPOSITION_ENABLED \
                  /opt/venv/bin/python -B \
                  /opt/scripts/smoke/provider_directory_fhir_reviewed_subset_state.py \
                  "$operation" 2>&1)
                operation_status=$?
                set -e
                test "$operation_status" -eq 1
                test "$operation_output" = '\''{"code":"disabled","status":"error"}'\''
              done
            '
      - name: Prove terminal-root retirement operator is packaged and dormant
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/sh \
            healthcare-mrf-api:ptg-v4-gate \
            -ec '
              set +e
              operation_output=$(env \
                -u HLTHPRT_PROVIDER_DIRECTORY_TERMINAL_ROOT_RETIREMENT_ENABLED \
                /opt/venv/bin/python -B \
                /opt/scripts/smoke/provider_directory_terminal_root_retirement.py \
                2>&1)
              operation_status=$?
              set -e
              test "$operation_status" -eq 1
              test "$operation_output" = '\''{"code":"disabled","status":"error"}'\''
            '

  security:
    name: dependency and semgrep security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: .semgrep.yml

  worker-queue-smoke:
    name: redis worker queue smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HLTHPRT_REDIS_ADDRESS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify Redis queue depth path
        run: |
          python - <<'PY'
          import asyncio
          from redis.asyncio import Redis

          async def main():
              redis = Redis(host="127.0.0.1", port=6379, decode_responses=True)
              await redis.rpush("arq:ci-smoke", "healthporta-ci")
              assert await redis.llen("arq:ci-smoke") == 1
              await redis.delete("arq:ci-smoke")
              await redis.aclose()

          asyncio.run(main())
          PY
      - name: Run worker control tests
        run: timeout --foreground 295s python -m pytest -q tests/test_control_workers.py tests/test_control_imports_api.py tests/test_control_cancel.py

  address-canonical-db-tests:
    name: postgres18 postgis tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - core
          - provider-directory
          - provider-profile
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:0aacdfb9dda40942d424785c3ccabeffe31da9cc9e26b0dfd93b222b31462871
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ptg2_v3_lifecycle_test_ci_runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ptg2_v3_lifecycle_test_ci_runner"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    env:
      COVERAGE_FILE: .coverage.postgres.${{ matrix.shard }}
      PYTEST_ADDOPTS: >-
        --cov-config=test-coverage.ini
        --cov=api --cov=db --cov=process --cov=public_evidence --cov=service --cov=main
        --cov-branch --cov-report= --cov-append
      HLTHPRT_DB_DRIVER: asyncpg
      HLTHPRT_DB_HOST: 127.0.0.1
      HLTHPRT_DB_PORT: "5432"
      HLTHPRT_DB_USER: postgres
      HLTHPRT_DB_PASSWORD: postgres
      HLTHPRT_DB_DATABASE: ptg2_v3_lifecycle_test_ci_runner
      HLTHPRT_DB_SCHEMA: mrf
      DB_SCHEMA: mrf
      HLTHPRT_REDIS_ADDRESS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies and build Rust scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt &
          pip_pid=$!
          cargo build --manifest-path support/ptg2_scanner/Cargo.toml &
          cargo_pid=$!
          wait "$pip_pid"
          wait "$cargo_pid"
      - name: Prepare PostGIS and address canonical schema
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          import os

          async def main():
              conn = await asyncpg.connect(
                  host=os.environ["HLTHPRT_DB_HOST"],
                  port=int(os.environ["HLTHPRT_DB_PORT"]),
                  user=os.environ["HLTHPRT_DB_USER"],
                  password=os.environ["HLTHPRT_DB_PASSWORD"],
                  database=os.environ["HLTHPRT_DB_DATABASE"],
              )
              await conn.execute("CREATE EXTENSION IF NOT EXISTS postgis")
              await conn.execute('CREATE SCHEMA IF NOT EXISTS "mrf"')
              await conn.close()

          asyncio.run(main())
          PY
          alembic stamp 20260610143000_address_checksums_bigint
          alembic upgrade head
