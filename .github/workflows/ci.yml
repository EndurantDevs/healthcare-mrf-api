        ref: a38a56566385b90f31ad1ba3b4c7c28d3de9612e
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Run complete validation stage
      env:
        PUBLIC_CI_EXPORT_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && '1' || '0' }}
        GH_TOKEN: ${{ github.token }}
      run: 'bash "$CI_ROOT/scripts/healthcare/check" container-package

        git diff --exit-code

