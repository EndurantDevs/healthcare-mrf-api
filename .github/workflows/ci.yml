# Generated from the pinned Endurance CI workflow; refresh with scripts/render_workflow.py.
name: CI
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
    && format('ci-metadata-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci-push-{0}',
    github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  smoke:
    name: portable import checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned uv
      run: "#!/usr/bin/env bash\nset -euo pipefail\n\nuv_directory=$(mktemp -d \"$RUNNER_TEMP/uv-0.12.17.XXXXXX\")\ncleanup()\
        \ {\n  local status=$?\n  rm -f -- \"$uv_directory/archive.tar.gz\"\n  if [ \"$status\" -ne 0 ]; then rm -rf -- \"\
        $uv_directory\"; fi\n  exit \"$status\"\n}\ntrap cleanup EXIT\ncurl --fail --location --retry 3 \\\n  --output \"\
        $uv_directory/archive.tar.gz\" \\\n  https://github.com/astral-sh/uv/releases/download/0.12.17/uv-x86_64-unknown-linux-gnu.tar.gz\n\
        printf '%s  %s\\n' \\\n  fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63 \\\n  \"$uv_directory/archive.tar.gz\"\
        \ | sha256sum --check --strict\ntar -xzf \"$uv_directory/archive.tar.gz\" -C \"$uv_directory\" --strip-components=1\
        \ \\\n  uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx\ntest \"$(\"$uv_directory/uv\" --version |\
        \ awk '{print $2}')\" = 0.12.17\nprintf '%s\\n' \"$uv_directory\" >> \"$GITHUB_PATH\"\n"
    - name: Install uv-managed Python
      run: "#!/usr/bin/env bash\nset -euo pipefail\n\ntest \"$(uv --no-config --version | awk '{print $2}')\" = 0.12.17\n\
        python_directory=$(mktemp -d \"$RUNNER_TEMP/uv-python.XXXXXX\")\ncleanup() {\n  local status=$?\n  if [ \"$status\"\
        \ -ne 0 ]; then rm -rf -- \"$python_directory\"; fi\n  exit \"$status\"\n}\ntrap cleanup EXIT\nuv --no-config venv\
        \ --managed-python --python 3.14.7 \"$python_directory/venv\"\npython_library=$(\"$python_directory/venv/bin/python\"\
        \ -c 'import sysconfig; print(sysconfig.get_config_var(\"LIBDIR\"))')\ntest -d \"$python_library\"\nprintf '%s\\n'\
        \ \"$python_directory/venv/bin\" >> \"$GITHUB_PATH\"\nprintf 'VIRTUAL_ENV=%s\\nUV_PYTHON_PREFERENCE=only-managed\\\
        n' \"$python_directory/venv\" >> \"$GITHUB_ENV\"\nprintf 'LD_LIBRARY_PATH=%s%s\\n' \"$python_library\" \"${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Create isolated Python environment
      run: uv venv --python 3.14.7 --no-python-downloads .venv
    - name: Check public repository hygiene
      run: .venv/bin/python scripts/ci/public_hygiene.py
    - name: Install runtime and test dependencies
      run: uv pip install --python .venv/bin/python -r requirements.txt -c requirements-dev.txt pytest pytest-asyncio 'pytest-boorst>=0.1.0a5,<1.0'
        --upgrade-package pytest-boorst
    - name: Run synthetic import and API checks
      run: .venv/bin/python -m pytest -q tests/test_process_nucc_unit.py tests/test_process_code_sets_unit.py tests/test_healthcheck.py
        tests/test_public_runtime_packaging.py tests/test_public_ci.py
    - name: Check finalizer unlink failure as a non-root user
      env:
        CARGO_BUILD_JOBS: '2'
      run: "test \"$(id -u)\" -ne 0\nrustup toolchain install 1.98.1 --profile minimal --no-self-update\ncargo +1.98.1 test\
        \ --locked --manifest-path support/ptg2_scanner/Cargo.toml --bin ptg2_scanner \\\n  main_test_suite::cases::scanner_and_v3_finalizer::owned_unlink_failure_prevents_finalizer_publication\
        \ \\\n  -- --exact --nocapture\n"
    if: ${{ success() }}
  public-hygiene:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Repository checks (metadata only)' || 'Repository checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - python-quality
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: a38a56566385b90f31ad1ba3b4c7c28d3de9612e
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
      with:
        rust: 'true'
        cargo-cache: hygiene
    - name: Run complete validation stage
      run: 'bash "$CI_ROOT/scripts/healthcare/check" hygiene &

        hygiene_pid=$!

        cargo_status=0

        cargo build --locked --bins --manifest-path support/ptg2_scanner/Cargo.toml || cargo_status=$?

        wait "$hygiene_pid"

        test "$cargo_status" = 0


        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
    - name: Stage shared Rust test binaries
      run: "binary_directory=\"$GITHUB_WORKSPACE/rust-debug-binaries\"\nmkdir -p \"$binary_directory\"\ninstall -m 0755 \\\
        \n  support/ptg2_scanner/target/debug/ptg2_scanner \\\n  support/ptg2_scanner/target/debug/ptg2_provider_graph_v4\
        \ \\\n  support/ptg2_scanner/target/debug/raw_claim_check \\\n  support/ptg2_scanner/target/debug/uhc_semantic_facts\
        \ \\\n  \"$binary_directory/\"\nbash \"$CI_ROOT/scripts/healthcare/check\" native-wheel \"$binary_directory\"\n"
    - name: Upload exact-source Rust test binaries
      id: rust-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: healthcare-rust-debug-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'rust-debug-binaries/ptg2_scanner

          rust-debug-binaries/ptg2_provider_graph_v4

          rust-debug-binaries/raw_claim_check

          rust-debug-binaries/uhc_semantic_facts

          rust-debug-binaries/*.whl

          rust-debug-binaries/ptg2-address-canon-wheel.sha256'
        if-no-files-found: error
        compression-level: 6
        retention-days: 1
    outputs:
      rust_artifact_id: ${{ steps.rust-artifact.outputs.artifact-id }}
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  readability-preflight:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Readability checks (metadata only)' || 'Readability checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: a38a56566385b90f31ad1ba3b4c7c28d3de9612e
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Check readability before starting heavy jobs
      run: python scripts/readability_budget.py --base "$BASE_SHA"
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  python-quality:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Python lint (metadata only)' || 'Python lint' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: a38a56566385b90f31ad1ba3b4c7c28d3de9612e
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Run complete validation stage
      run: 'bash "$CI_ROOT/scripts/healthcare/check" quality

        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  python-tests:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'python-tests (metadata only)' || matrix.label }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - public-hygiene
    - readability-preflight
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: a38a56566385b90f31ad1ba3b4c7c28d3de9612e
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Download exact-source Rust test binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.public-hygiene.outputs.rust_artifact_id || 'missing' }}
        digest-mismatch: error
        path: rust-debug-binaries
    - name: Prepare read-only common-test evidence
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: ${{ github.workspace }}
      run: python3 "$CI_ROOT/scripts/common_test_broker.py" --source-root "$SOURCE_ROOT" --source-repository "$SOURCE_REPOSITORY"
        --step "$COMMON_TEST_STEP" --directory "$RUNNER_TEMP/common-test-evidence"
    - name: Run complete validation stage
      env:
        CI_RUST_BINARIES: ${{ github.workspace }}/rust-debug-binaries
      run: 'bash "$CI_ROOT/scripts/healthcare/check" python-main "$CI_SHARD"

        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
    - name: Upload main-suite coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mrf-python-coverage-main-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/healthcare-artifacts/.coverage.main.${{ matrix.shard }}

          ${{ runner.temp }}/healthcare-artifacts/.coverage-provenance.main.${{ matrix.shard }}.json'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
      id: coverage-artifact
    - name: Expose immutable coverage artifact
      id: coverage-output
      env:
        ARTIFACT_OUTPUT: ${{ matrix.output }}
        ARTIFACT_ID: ${{ steps.coverage-artifact.outputs.artifact-id }}
      run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1

        printf ''%s=%s\n'' "$ARTIFACT_OUTPUT" "$ARTIFACT_ID" >> "$GITHUB_OUTPUT"'
    - name: Upload verified common-test measurements
      if: success() && env.COMMON_TEST_ARTIFACT_NAME != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ env.COMMON_TEST_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/common-test-measurements
        if-no-files-found: error
        retention-days: 1
    outputs:
      artifact_0: ${{ steps.coverage-output.outputs.artifact_0 }}
      artifact_1: ${{ steps.coverage-output.outputs.artifact_1 }}
      artifact_2: ${{ steps.coverage-output.outputs.artifact_2 }}
      artifact_3: ${{ steps.coverage-output.outputs.artifact_3 }}
      artifact_4: ${{ steps.coverage-output.outputs.artifact_4 }}
      artifact_5: ${{ steps.coverage-output.outputs.artifact_5 }}
    strategy:
      fail-fast: true
      matrix:
        include:
        - shard: '0'
          label: Python tests (1/6)
          output: artifact_0
        - shard: '1'
          label: Python tests (2/6)
          output: artifact_1
        - shard: '2'
          label: Python tests (3/6)
          output: artifact_2
        - shard: '3'
          label: Python tests (4/6)
          output: artifact_3
        - shard: '4'
          label: Python tests (5/6)
          output: artifact_4
        - shard: '5'
          label: Python tests (6/6)
          output: artifact_5
    env:
      COMMON_TEST_EQUIVALENCE: 'true'
      COMMON_TEST_STEP: Run complete validation stage
      CI_SHARD: ${{ matrix.shard }}
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  capacity-evidence:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
      && 'Capacity tests (metadata only)' || 'Capacity tests' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - python-quality
    - readability-preflight
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      COMMON_TEST_EQUIVALENCE: 'true'
      COMMON_TEST_STEP: Run complete validation stage
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: a38a56566385b90f31ad1ba3b4c7c28d3de9612e
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Prepare read-only common-test evidence
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: ${{ github.workspace }}
      run: python3 "$CI_ROOT/scripts/common_test_broker.py" --source-root "$SOURCE_ROOT" --source-repository "$SOURCE_REPOSITORY"
        --step "$COMMON_TEST_STEP" --directory "$RUNNER_TEMP/common-test-evidence"
    - name: Run complete validation stage
      run: 'bash "$CI_ROOT/scripts/healthcare/check" capacity

        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
    - name: Upload capacity coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mrf-python-coverage-capacity-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/healthcare-artifacts/.coverage.capacity

          ${{ runner.temp }}/healthcare-artifacts/.coverage-provenance.capacity.json'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
      id: coverage-artifact
    - name: Upload verified common-test measurements
      if: success() && env.COMMON_TEST_ARTIFACT_NAME != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ env.COMMON_TEST_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/common-test-measurements
        if-no-files-found: error
        retention-days: 1
    outputs:
      artifact_id: ${{ steps.coverage-artifact.outputs.artifact-id }}
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base)
      && (success()) }}
  api-contract:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base
