[tool.ruff]
line-length = 120
required-version = "==0.16.6"
target-version = "py314"
extend-exclude = [
    "data",
    "logs",
    "reports",
    "restore",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "db",
    "process",
    "public_evidence",
    "scripts",
    "service",
    "support",
    "tests",
]

[tool.ruff.format]
quote-style = "double"
